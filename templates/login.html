<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · Precarga SHAT</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
  .login-box { width:360px; }
  .logo { text-align:center; margin-bottom:28px; }
  .logo .icon { font-size:40px; }
  .logo h1 { font-size:20px; font-weight:600; margin-top:8px; }
  .logo p { color:var(--muted); font-size:13px; margin-top:4px; }
  .alert { padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }
  .alert-red  { background:#3a1a1a; color:var(--red);   border:1px solid #5a2a2a; }
  .alert-amber{ background:#3a2a0a; color:var(--amber); border:1px solid #5a4a0a; }
  .footer-link { text-align:center; margin-top:16px; font-size:13px; color:var(--muted); }
  .footer-link a { color:var(--blue); text-decoration:none; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <div class="icon">🛢</div>
    <h1>Precarga SHAT</h1>
    <p>Sistema de precarga de solicitudes</p>
  </div>

  <div class="card">
    {% if expired %}
    <div class="alert alert-amber">⚠ Tu suscripción ha expirado. Contacta al administrador.</div>
    {% endif %}
    {% if error %}
    <div class="alert alert-red">✗ Usuario o contraseña incorrectos, o suscripción expirada.</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input class="input" type="text" name="username" placeholder="Tu usuario" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input class="input" type="password" name="password" placeholder="Tu contraseña" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:4px">
        Iniciar sesión
      </button>
    </form>
  </div>

  <div class="footer-link">
    ¿No tienes cuenta? <a href="/registro">Solicitar acceso</a>
  </div>
</div>
</body>
</html>
