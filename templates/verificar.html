<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificar email · Precarga SHAT</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
  .box { width:380px; }
  .logo { text-align:center; margin-bottom:28px; }
  .logo .icon { font-size:40px; }
  .logo h1 { font-size:20px; font-weight:600; margin-top:8px; }
  .logo p { color:var(--muted); font-size:13px; margin-top:4px; }
  .alert-red { padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; background:#3a1a1a; color:var(--red); border:1px solid #5a2a2a; }
  .info { padding:10px 14px; border-radius:8px; font-size:12px; margin-bottom:16px; background:#1a2a4a; color:var(--blue); border:1px solid #2a3a6a; }
  .success { padding:10px 14px; border-radius:8px; font-size:12px; margin-bottom:16px; background:#1a4a2a; color:var(--green); border:1px solid #2a6a4a; }
  .footer-link { text-align:center; margin-top:16px; font-size:13px; color:var(--muted); }
  .footer-link a { color:var(--blue); text-decoration:none; }
  .code-input {
    letter-spacing: 8px;
    font-size: 20px;
    text-align: center;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="icon">✉️</div>
    <h1>Verificar email</h1>
    <p>Revisa tu bandeja de entrada</p>
  </div>

  <div class="card">
    <div class="info">ℹ Hemos enviado un código de 6 dígitos a <strong>{{ email }}</strong>. Ingresa el código para completar tu registro.</div>

    {% if error %}
    <div class="alert-red">✗ {{ error }}</div>
    {% endif %}

    {% if info %}
    <div class="success">✓ {{ info }}</div>
    {% endif %}

    <form method="post" action="/verificar">
      <input type="hidden" name="email" value="{{ email }}">
      <div class="form-group">
        <label class="form-label">Código de verificación</label>
        <input class="input code-input" type="text" name="codigo" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="off">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">
        Verificar y crear cuenta
      </button>
    </form>

    <form method="post" action="/registro/reenviar" style="margin-top:12px;">
      <input type="hidden" name="email" value="{{ email }}">
      <button class="btn btn-text" type="submit" style="width:100%;justify-content:center;color:var(--muted);font-size:12px;">
        Reenviar código
      </button>
    </form>
  </div>

  <div class="footer-link">
    <a href="/registro">← Volver al registro</a>
  </div>
</div>
</body>
</html>
