<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solicitar acceso · Precarga SHAT</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
  .box { width:380px; }
  .logo { text-align:center; margin-bottom:28px; }
  .logo .icon { font-size:40px; }
  .logo h1 { font-size:20px; font-weight:600; margin-top:8px; }
  .logo p { color:var(--muted); font-size:13px; margin-top:4px; }
  .alert-red { padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; background:#3a1a1a; color:var(--red); border:1px solid #5a2a2a; }
  .info { padding:10px 14px; border-radius:8px; font-size:12px; margin-bottom:16px; background:#1a2a4a; color:var(--blue); border:1px solid #2a3a6a; }
  .footer-link { text-align:center; margin-top:16px; font-size:13px; color:var(--muted); }
  .footer-link a { color:var(--blue); text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="icon">🛢</div>
    <h1>Crear cuenta</h1>
    <p>10 descargas gratis incluidas</p>
  </div>

  <div class="card">
    <div class="info">ℹ Regístrate y empieza a descargar inmediatamente. Incluye 10 descargas gratuitas.</div>

    {% if error %}
    <div class="alert-red">✗ {{ error }}</div>
    {% endif %}

    <form method="post" action="/registro">
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input class="input" type="text" name="username" placeholder="Mínimo 3 caracteres" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input class="input" type="password" name="password" placeholder="Mínimo 6 caracteres" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmar contraseña</label>
        <input class="input" type="password" name="password2" placeholder="Repite la contraseña" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">
        Crear cuenta
      </button>
    </form>
  </div>

  <div class="footer-link">
    ¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a>
  </div>
</div>
</body>
</html>
