<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#skyGrad)" />

  <!-- Sun/Moon -->
  <circle cx="100" cy="80" r="40" fill="#fbbf24" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.6;0.8" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Stars -->
  <circle cx="200" cy="50" r="1.5" fill="white" opacity="0.8" />
  <circle cx="300" cy="30" r="1" fill="white" opacity="0.6" />
  <circle cx="500" cy="40" r="1.5" fill="white" opacity="0.7" />
  <circle cx="650" cy="60" r="1" fill="white" opacity="0.5" />
  <circle cx="750" cy="35" r="1.5" fill="white" opacity="0.8" />
  <circle cx="400" cy="20" r="1" fill="white" opacity="0.4" />

  <!-- Distant ship silhouette -->
  <path d="M 620 280 L 750 280 L 740 250 L 630 250 Z" fill="#1e293b" opacity="0.5" />
  <rect x="680" y="230" width="8" height="20" fill="#1e293b" opacity="0.5" />
  <rect x="700" y="235" width="6" height="15" fill="#1e293b" opacity="0.5" />
  <path d="M 600 320 L 800 320 L 800 350 L 580 350 Z" fill="url(#waterGrad)" />

  <!-- Main Ship -->
  <g transform="translate(50, 80)">
    <!-- Ship Hull -->
    <path d="M 50 280 L 600 280 L 580 220 L 120 220 L 100 200 L 70 200 Z" fill="url(#shipGrad)" stroke="#475569" stroke-width="1" />

    <!-- Deck details -->
    <rect x="120" y="220" width="450" height="8" fill="#1e293b" />
    <rect x="150" y="228" width="400" height="4" fill="#334155" />

    <!-- Bridge/Superstructure -->
    <rect x="350" y="150" width="180" height="70" fill="#475569" stroke="#334155" />
    <rect x="360" y="160" width="160" height="50" fill="#1e293b" />
    <rect x="370" y="165" width="30" height="20" fill="#3b82f6" opacity="0.6" />
    <rect x="410" y="165" width="30" height="20" fill="#3b82f6" opacity="0.6" />
    <rect x="450" y="165" width="30" height="20" fill="#3b82f6" opacity="0.6" />
    <rect x="490" y="165" width="20" height="20" fill="#3b82f6" opacity="0.6" />

    <!-- Chimney/Stack -->
    <rect x="280" y="170" width="40" height="50" fill="#64748b" />
    <rect x="285" y="160" width="30" height="10" fill="#475569" />
    <ellipse cx="300" cy="160" rx="15" ry="3" fill="#94a3b8" />

    <!-- Smoke -->
    <circle cx="300" cy="150" r="8" fill="#94a3b8" opacity="0.4">
      <animate attributeName="cy" values="150;140;130" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.2;0" dur="3s" repeatCount="indefinite" />
      <animate attributeName="r" values="8;12;16" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="310" cy="145" r="6" fill="#94a3b8" opacity="0.3">
      <animate attributeName="cy" values="145;135;125" dur="3s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.15;0" dur="3s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="6;10;14" dur="3s" begin="0.5s" repeatCount="indefinite" />
    </circle>

    <!-- Cargo tanks -->
    <rect x="130" y="190" width="200" height="30" fill="#475569" />
    <rect x="135" y="195" width="190" height="20" fill="#334155" />
    <!-- Pipe lines -->
    <rect x="130" y="205" width="200" height="3" fill="#1e293b" />

    <!-- Pipeline/Valves -->
    <rect x="50" y="225" width="70" height="8" fill="#64748b" />
    <circle cx="70" cy="229" r="6" fill="#475569" />
    <rect x="67" y="219" width="6" height="20" fill="#94a3b8" />

    <!-- Cranes -->
    <path d="M 180 220 L 180 180 L 210 190" stroke="#64748b" stroke-width="4" fill="none" />
    <rect x="175" y="175" width="10" height="20" fill="#475569" />
    <path d="M 220 220 L 220 185 L 250 195" stroke="#64748b" stroke-width="4" fill="none" />
    <rect x="215" y="180" width="10" height="20" fill="#475569" />

    <!-- Bow detail -->
    <path d="M 50 280 L 70 200 L 100 200 L 90 220" fill="#334155" />

    <!-- Ship name -->
    <text x="450" y="260" fill="#94a3b8" font-size="12" font-family="Arial" opacity="0.7">PEMEX MARINE</text>
  </g>

  <!-- Water/Waves -->
  <path d="M 0 360 L 800 360 L 800 500 L 0 500 Z" fill="url(#waterGrad)" />

  <!-- Wave lines -->
  <path d="M 0 370 Q 50 365 100 370 T 200 370 T 300 370 T 400 370 T 500 370 T 600 370 T 700 370 T 800 370" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.3">
    <animate attributeName="d" values="M 0 370 Q 50 365 100 370 T 200 370 T 300 370 T 400 370 T 500 370 T 600 370 T 700 370 T 800 370; M 0 370 Q 50 375 100 370 T 200 370 T 300 370 T 400 370 T 500 370 T 600 370 T 700 370 T 800 370; M 0 370 Q 50 365 100 370 T 200 370 T 300 370 T 400 370 T 500 370 T 600 370 T 700 370 T 800 370" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M 0 385 Q 100 380 200 385 T 400 385 T 600 385 T 800 385" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.4">
    <animate attributeName="d" values="M 0 385 Q 100 380 200 385 T 400 385 T 600 385 T 800 385; M 0 385 Q 100 390 200 385 T 400 385 T 600 385 T 800 385; M 0 385 Q 100 380 200 385 T 400 385 T 600 385 T 800 385" dur="5s" repeatCount="indefinite" />
  </path>
  <path d="M 0 400 Q 80 395 160 400 T 320 400 T 480 400 T 640 400 T 800 400" stroke="#93c5fd" stroke-width="1" fill="none" opacity="0.2">
    <animate attributeName="d" values="M 0 400 Q 80 395 160 400 T 320 400 T 480 400 T 640 400 T 800 400; M 0 400 Q 80 405 160 400 T 320 400 T 480 400 T 640 400 T 800 400; M 0 400 Q 80 395 160 400 T 320 400 T 480 400 T 640 400 T 800 400" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Reflections -->
  <rect x="70" y="360" width="530" height="5" fill="#3b82f6" opacity="0.1" />

  <!-- Grid overlay for tech effect -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.05" />
  </pattern>
  <rect width="800" height="500" fill="url(#grid)" />
</svg>
