<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons del paquete /logos. El .ico va primero con sizes="any":
         es el que algunos navegadores siguen pidiendo y evita el 404. -->
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- #1A1A1F es --background del tema; el hero azul de la landing es solo
         una seccion, no el color general de la app. -->
    <meta name="theme-color" content="#1A1A1F" />

    <!-- PWA: permite instalar la app en el escritorio y abrirla sin barra de
         navegador. apple-mobile-web-app-capable hace lo mismo en iOS, que
         ignora el manifest y solo lee estas meta. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PreCarga" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="PreCarga — gestión de activos: procesa PDFs, controla altas y bajas, y centraliza compañías, activos y auditoría."
    />
    <title>PreCarga</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
